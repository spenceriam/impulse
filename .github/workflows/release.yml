name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.15.1)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: bun-linux-x64
          # Linux ARM64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: bun-linux-arm64
          # macOS ARM64 (M-series, Apple Silicon)
          - os: macos-latest
            platform: darwin
            arch: arm64
            target: bun-darwin-arm64
          # macOS x64 (Intel) - using macos-15-intel runner
          - os: macos-15-intel
            platform: darwin
            arch: x64
            target: bun-darwin-x64
          # Windows x64
          - os: windows-latest
            platform: windows
            arch: x64
            target: bun-windows-x64
          # Windows ARM64 (cross-compiled from Linux — Bun target bun-windows-arm64)
          - os: ubuntu-latest
            platform: windows
            arch: arm64
            target: bun-windows-arm64

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build dist
        run: bun run build

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build binary
        shell: bash
        run: |
          mkdir -p packages/${{ matrix.platform }}-${{ matrix.arch }}/bin
          # --no-compile-autoload-bunfig prevents the compiled binary from trying to load bunfig.toml
          # JSX is already transformed during 'bun run build' step, so preload is not needed
          if [ "${{ matrix.platform }}" = "windows" ]; then
            # Windows builds (native or cross-compiled) need .exe extension
            bun build --compile --minify --no-compile-autoload-bunfig --target=${{ matrix.target }} ./dist/index.js --outfile packages/${{ matrix.platform }}-${{ matrix.arch }}/bin/impulse.exe
          else
            bun build --compile --minify --no-compile-autoload-bunfig --target=${{ matrix.target }} ./dist/index.js --outfile packages/${{ matrix.platform }}-${{ matrix.arch }}/bin/impulse
            chmod +x packages/${{ matrix.platform }}-${{ matrix.arch }}/bin/impulse
          fi

      - name: Bundle rg binary
        shell: bash
        run: |
          RG_PLATFORM="${{ matrix.platform == 'windows' && 'win32' || matrix.platform }}"
          RG_PKG="@vscode/ripgrep-${RG_PLATFORM}-${{ matrix.arch }}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp "node_modules/${RG_PKG}/bin/rg.exe" "packages/${{ matrix.platform }}-${{ matrix.arch }}/bin/rg.exe"
          else
            cp "node_modules/${RG_PKG}/bin/rg" "packages/${{ matrix.platform }}-${{ matrix.arch }}/bin/rg"
            chmod +x "packages/${{ matrix.platform }}-${{ matrix.arch }}/bin/rg"
          fi

      - name: Create platform package.json
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > packages/${{ matrix.platform }}-${{ matrix.arch }}/package.json << EOF
          {
            "name": "@spenceriam/impulse-${{ matrix.platform }}-${{ matrix.arch }}",
            "version": "$VERSION",
            "description": "IMPULSE binary for ${{ matrix.platform }}-${{ matrix.arch }}",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/spenceriam/impulse.git"
            },
            "os": ["${{ matrix.platform == 'windows' && 'win32' || matrix.platform }}"],
            "cpu": ["${{ matrix.arch }}"],
            "files": ["bin/*"],
            "publishConfig": {
              "access": "public"
            }
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: impulse-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/${{ matrix.platform }}-${{ matrix.arch }}/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package release binaries
        run: |
          mkdir -p release-assets
          for platform_dir in artifacts/impulse-*/; do
            platform_name=$(basename "$platform_dir")
            echo "Packaging $platform_name..."
            if [ -f "$platform_dir/bin/impulse.exe" ]; then
              (cd "$platform_dir" && zip -r "../../release-assets/${platform_name}.zip" bin)
            else
              tar -czf "release-assets/${platform_name}.tar.gz" -C "$platform_dir" bin
            fi
          done
          ls -la release-assets/

      - name: Generate release notes from CHANGELOG
        run: node scripts/changelog-to-release-notes.mjs "${{ steps.version.outputs.version }}"

      - name: Read release title
        id: release_title
        run: echo "title=$(cat release-title.txt)" >> $GITHUB_OUTPUT

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.release_title.outputs.title }}
          body_path: release-notes.md
          draft: true
          files: release-assets/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Publish platform packages
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Publish all platform packages first. Verification happens in a
          # later step so npm CDN propagation for early packages overlaps with
          # publishing the rest (avoids racing a per-package 404 right after publish).
          for platform_dir in artifacts/impulse-*/; do
            platform_name=$(basename "$platform_dir")
            pkg="@spenceriam/${platform_name}"
            cd "$platform_dir"

            if npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
              echo "${pkg}@${VERSION} already on npm — skipping publish"
            else
              echo "Publishing ${pkg}@${VERSION}..."
              npm publish --access public
            fi

            cd - >/dev/null
          done

      - name: Verify platform tarballs
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Gate before publishing the wrapper: every platform tarball the
          # wrapper's optionalDependencies point at must be downloadable.
          # Generous retry (~10 min total) tolerates normal registry propagation;
          # only a genuine ghost publish (permanent 404) fails the job.
          fail=0
          for platform_dir in artifacts/impulse-*/; do
            platform_name=$(basename "$platform_dir")
            pkg="@spenceriam/${platform_name}"
            tarball_url="https://registry.npmjs.org/@spenceriam/${platform_name}/-/${platform_name}-${VERSION}.tgz"

            echo "Verifying tarball: ${tarball_url}"
            ok=false
            for attempt in $(seq 1 40); do
              if curl -fsSL -o /dev/null "${tarball_url}"; then
                ok=true
                break
              fi
              echo "Tarball not downloadable yet (attempt ${attempt}/40), waiting 15s..."
              sleep 15
            done
            if [ "${ok}" != "true" ]; then
              echo "::error::${pkg}@${VERSION} tarball still missing after ~10m (npm registry 404)."
              fail=1
            else
              echo "Tarball verified for ${pkg}@${VERSION}"
            fi
          done

          if [ "${fail}" != "0" ]; then
            echo "::error::One or more platform tarballs are missing; not publishing the wrapper."
            exit 1
          fi

      - name: Create CLI wrapper package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p packages/cli/bin
          
          # Create package.json with correct version
          cat > packages/cli/package.json << EOF
          {
            "name": "@spenceriam/impulse",
            "version": "$VERSION",
            "description": "Provider-flexible terminal AI coding agent",
            "license": "MIT",
            "bin": {
              "impulse": "./bin/impulse"
            },
            "scripts": {
              "postinstall": "node ./postinstall.mjs"
            },
            "repository": {
              "type": "git",
              "url": "git+https://github.com/spenceriam/impulse.git"
            },
            "homepage": "https://github.com/spenceriam/impulse#readme",
            "keywords": ["ai", "cli", "impulse", "terminal", "coding", "agent"],
            "author": "Spencer Francisco",
            "files": ["bin/*", "postinstall.mjs"],
            "publishConfig": {
              "access": "public"
            },
            "optionalDependencies": {
              "@spenceriam/impulse-linux-x64": "$VERSION",
              "@spenceriam/impulse-linux-arm64": "$VERSION",
              "@spenceriam/impulse-darwin-x64": "$VERSION",
              "@spenceriam/impulse-darwin-arm64": "$VERSION",
              "@spenceriam/impulse-windows-x64": "$VERSION",
              "@spenceriam/impulse-windows-arm64": "$VERSION"
            }
          }
          EOF

      - name: Publish CLI wrapper
        run: |
          cd packages/cli
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "@spenceriam/impulse@${VERSION}" version >/dev/null 2>&1; then
            echo "@spenceriam/impulse@${VERSION} already on npm — skipping wrapper publish"
          else
            npm publish --access public
          fi

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@spenceriam'

      - name: Publish CLI wrapper to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/cli
          npm publish --registry=https://npm.pkg.github.com || echo "GitHub Packages publish skipped (may already exist or lack permission)"
